version: 1
applications:
  - appRoot: portable-gallery
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - .next/cache/**/*
    appSettings:
      artifactsBaseDirectory: out
      framework: nextjs
